<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Premium Predictor</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="background-blur"></div>

<div class="bg-animation">

    <span class="blob blob1"></span>
    <span class="blob blob2"></span>
    <span class="blob blob3"></span>

    <i class="fa-solid fa-shield-heart floating-icon icon1"></i>
    <i class="fa-solid fa-heart-pulse floating-icon icon2"></i>
    <i class="fa-solid fa-user-shield floating-icon icon3"></i>

</div>

<div class="cursor-glow"></div>

<div class="container">

    <div class="hero">

        <h1>Insurance Premium Predictor</h1>

        <p>
            Get an instant insurance premium category prediction using
            Machine Learning.
        </p>

    </div>

    <div class="card">

        <div class="grid">

            <div class="input-group">
                <label>Age</label>
                <input type="number" id="age" value="30">
            </div>

            <div class="input-group">
                <label>Weight (kg)</label>
                <input type="number" id="weight" value="65">
            </div>

            <div class="input-group">
                <label>Height (m)</label>
                <input type="number" step="0.01" id="height" value="1.7">
            </div>

            <div class="input-group">
                <label>Income (LPA)</label>
                <input type="number" step="0.1" id="income" value="10">
            </div>

            <div class="input-group">
                <label>Smoker</label>
                <select id="smoker">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>

            <div class="input-group">
                <label>City</label>
                <input type="text" id="city" value="Mumbai">
            </div>

            <div class="input-group full">
                <label>Occupation</label>
                <select id="occupation">
                    <option>private_job</option>
                    <option>government_job</option>
                    <option>freelancer</option>
                    <option>business_owner</option>
                    <option>student</option>
                    <option>retired</option>
                    <option>unemployed</option>
                </select>
            </div>

        </div>

        <button onclick="predict()" id="predictBtn">
            <i class="fa-solid fa-brain"></i>
            Predict Premium
        </button>

        <div id="result"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
